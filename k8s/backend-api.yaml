apiVersion: apps/v1
kind: Deployment
metadata:
  name: cronmail-backend-api
  namespace: cronmail
  labels:
    app: cronmail-backend
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cronmail-backend
      component: api
  template:
    metadata:
      labels:
        app: cronmail-backend
        component: api
    spec:
      containers:
        - name: backend
          image: harbor.xhwltech.com/xhcloud/cronmail-backend:latest
          imagePullPolicy: Always
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cronmail-config
            - secretRef:
                name: cronmail-secret
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: CORS_ORIGINS
              value: '["*"]'
          # 健康检查
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: cronmail-backend
  namespace: cronmail
  labels:
    app: cronmail-backend
spec:
  type: NodePort
  selector:
    app: cronmail-backend
    component: api
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
      nodePort: 30082
