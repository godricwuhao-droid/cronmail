# 资产运营管理平台附件存储 PersistentVolumeClaim
# 显式绑定到 asset-ops-attachments-pv（ADR-020：独立 NFS 子路径 /cronmail/asset-ops，与 cronmail 物理隔离，见 pv-attachments.yaml 说明）
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asset-ops-attachments-pvc
  namespace: asset-ops
  labels:
    app: asset-ops
    purpose: attachments
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 100Gi
  volumeName: asset-ops-attachments-pv   # 显式绑定到 PV
