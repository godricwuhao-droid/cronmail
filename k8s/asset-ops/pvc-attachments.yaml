# 资产运营管理平台附件存储 PersistentVolumeClaim
# 显式绑定到 asset-ops-attachments-pv（与 cronmail 共享同一 NFS 路径，见 pv-attachments.yaml 说明）
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asset-ops-attachments-pvc
  namespace: asset-ops
  labels:
    app: asset-ops
    purpose: attachments
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 100Gi
  volumeName: asset-ops-attachments-pv   # 显式绑定到 PV
