apiVersion: v1
kind: ConfigMap
metadata:
  name: asset-ops-config
  namespace: asset-ops
data:
  # 数据库连接 - 独立库 asset_ops（ADR-019），MySQL 仍复用 cronmail namespace 的实例（跨 namespace 完整名）
  DATABASE_URL: "mysql+pymysql://root:Qwert7891@mysql-master.cronmail.svc.cluster.local:3306/asset_ops"
  # Celery Broker - 复用 cronmail namespace 的 Redis（跨 namespace 完整名）
  # 注意：使用 db 1 与 cronmail 的 db 0 隔离，防止两平台 Celery Worker 共用队列互相消费任务
  CELERY_BROKER_URL: "redis://:Qwert7891@redis.cronmail.svc.cluster.local:6379/1"
  # 文档转换服务 - 复用 cronmail namespace 的 document-converter ClusterIP（跨 namespace，ADR-019 共享设施）
  # 注：当前分支后端代码未读取该变量（转换在镜像内本地执行），此处为 ADR-019 约定的共享设施声明，供后续模块使用
  DOCUMENT_CONVERTER_URL: "http://document-converter.cronmail.svc.cluster.local:8080"
  # 附件存储根目录（ADR-020：显式声明，防止将来误改代码默认值导致挂载点漂移）
  UPLOAD_BASE_DIR: "/app/uploads"
  # 应用元信息
  APP_TITLE: "Asset Ops API"
  APP_VERSION: "0.1.0"
  DEBUG: "false"
