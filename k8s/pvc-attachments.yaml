# CronMail 附件存储 PersistentVolumeClaim
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cronmail-attachments-pvc
  namespace: cronmail
  labels:
    app: cronmail
    purpose: attachments
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 100Gi
  volumeName: cronmail-attachments-pv   # 显式绑定到 PV
