apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: cronmail
  name: cronmail-beat-restarter
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cronmail-backend-beat"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: cronmail
  name: cronmail-beat-restarter
subjects:
  - kind: ServiceAccount
    name: default
    namespace: cronmail
roleRef:
  kind: Role
  name: cronmail-beat-restarter
  apiGroup: rbac.authorization.k8s.io
