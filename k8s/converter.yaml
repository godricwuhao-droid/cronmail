apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-converter
  namespace: cronmail
  labels:
    app: document-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-converter
  template:
    metadata:
      labels:
        app: document-converter
    spec:
      containers:
        - name: converter
          image: harbor.xhwltech.com/xhcloud/document-converter:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: document-converter
  namespace: cronmail
spec:
  selector:
    app: document-converter
  ports:
    - port: 8080
      targetPort: 8080
